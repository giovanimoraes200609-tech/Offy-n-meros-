<meta name="color-scheme" content="light dark">
<title>Offy · Controle de Números</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--line:#e5e9f2;--tx:#0f172a;--mut:#64748b;--g:#2563eb;--btn:#2563eb;--acs:#eaf1ff;--inp:#f1f5f9;--track:#e6ebf5;--err:#e5484d;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#131a2e;--line:#222c47;--tx:#e8edf8;--mut:#8e9bb8;--g:#6aa6ff;--btn:#2f6fed;--acs:#18284d;--inp:#0f1528;--track:#1e2742;--err:#ff7a7f;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{overscroll-behavior-y:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:4px 0 18px;display:flex;align-items:center;gap:10px}
h1 span{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:10px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--inp);border:1px solid transparent;color:var(--tx);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none;transition:.15s}
input::placeholder{color:var(--mut);opacity:.7}
input:focus{border-color:var(--g);background:var(--card);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
button{font:inherit;cursor:pointer}
.btn{background:var(--btn);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.92}
.btn.gh{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.dn{background:#e5484d;color:#fff}
.btn:active,.r:active,.nc div:active,.chip:active,.cb:active{transform:scale(.97)}
.hero{background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:0;color:#fff;box-shadow:0 12px 30px rgba(37,99,235,.28)}
.hero label{color:rgba(255,255,255,.82)}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-.03em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.hero input{background:rgba(255,255,255,.96);color:#0f172a}
.hero input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.3);border-color:transparent}
.hero .btn{background:#fff;color:#1d4ed8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.st.w{grid-column:span 2;background:var(--acs);border-color:transparent;box-shadow:none}
.st small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.st b{display:block;font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.st b.g{color:var(--g)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:99px;transition:width .3s}
small.m{display:block;margin-top:10px;font-size:13px;color:var(--mut);min-height:16px;line-height:1.45}
small.ok{color:#16a34a}small.err{color:var(--err)}
.hero small.m{color:rgba(255,255,255,.85)}.hero small.err{color:#ffd0d0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(15,23,42,.06)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;font-size:12px;font-weight:600;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--g);background:var(--acs)}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:var(--inp);border:1px solid transparent;color:var(--mut);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;transition:.15s}
.chip.on{background:var(--acs);color:var(--g);font-weight:600}
.r{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);transition:transform .1s,border-color .2s}
.r .ix{color:var(--mut);font-size:12px;width:62px;flex:none;overflow:hidden;white-space:nowrap}
.r b{font-size:18px;font-weight:650;flex:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.r .ac{font-size:12px;color:var(--mut);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .ac.ov{color:var(--g);font-weight:600}
.r i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:#fff;font-weight:800;font-size:14px;flex:none;transition:.15s}
.r.b{background:var(--acs);border-color:transparent}.r.b b{color:var(--g)}.r.b i{background:var(--btn);border-color:var(--btn)}
.nc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nc div{position:relative;background:var(--inp);border:1px solid transparent;border-radius:10px;padding:9px 0;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;transition:.15s}
.nc div.b{background:var(--btn);color:#fff;font-weight:600}
.nc div.f::after{content:"★";position:absolute;top:1px;right:4px;font-size:10px}
.nc div.fy::after{color:#f5b301}.nc div.fg::after{color:#16a34a}.nc div.fb::after{color:#3b82f6}
.nc div.b.fb::after,.nc div.b.fg::after{color:#fff}
.ah{display:flex;gap:8px;align-items:center}
.ah input{font-size:15px;font-weight:600}
.ed{position:relative;flex:1;display:flex;min-width:0}.ed input{padding-left:38px}
.ed::before{content:"✎";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px;pointer-events:none}
.more{width:100%;padding:13px;background:var(--card);color:var(--g);border:1px solid var(--line);border-radius:14px;font-weight:600}
.sum{font-size:13px;color:var(--mut);margin:12px 2px}
.prog{display:grid;grid-template-columns:84px 1fr;column-gap:18px;align-items:center}
.prog label{margin:0 0 6px}.prog small.m{margin-top:0}
.ring{grid-row:1/4;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--btn) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring b{position:relative;font-size:18px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;display:flex;align-items:center;gap:12px;background:#0f172a;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;font-size:14px;box-shadow:0 12px 30px rgba(15,23,42,.35);width:max-content;max-width:calc(100% - 28px);transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:grid;place-items:center;padding:20px;animation:fi .15s}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:340px;box-shadow:0 24px 60px rgba(15,23,42,.3);animation:up .2s}
.dlg h3{margin:0 0 8px;font-size:18px;font-weight:700}
.dlg p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.7}
.dlg .btn{flex:1;padding:13px}
.hl{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.hl span{color:var(--mut)}.hl b{font-variant-numeric:tabular-nums}
.dz{box-shadow:none}.dz label{color:var(--err)}.dz small.m{margin-top:10px}
.favc label{color:#d99a00}
.lk{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:8px 2px 0}
.r .fv{background:none;border:0;color:var(--mut);font-size:22px;padding:2px 6px;line-height:1;opacity:.6}
.r .fv.on{opacity:1}
.r .fv.on.fy{color:#f5b301}.r .fv.on.fg{color:#16a34a}.r .fv.on.fb{color:#3b82f6}
.r.fy,.r.fg,.r.fb{border-left-width:4px}
.r.fy{border-left-color:#f5b301}.r.fg{border-left-color:#16a34a}.r.fb{border-left-color:#3b82f6}
.cb{width:36px;height:36px;border-radius:50%;background:var(--c);border:0;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:0;transition:transform .1s}
.cb.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tx)}
.tgl{display:block;font-style:normal;font-size:11px;font-weight:600;letter-spacing:0;margin-top:1px}
.nc div.o{outline:2px dashed var(--g);outline-offset:-3px}
.cbw{text-align:center}.cbw small{display:block;margin-top:8px;color:var(--mut);font-size:12px}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(8px);opacity:0}}

#sy{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}#sy i{width:10px;height:10px;border-radius:50%;display:inline-block}
.r .ix .tgl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="toast"></div><div id="modal"></div>
<div id="app">
  <h1><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg></span> Offy · Controle de Números<small id="sy"></small></h1>
  <main id="v"></main>
</div>
<nav>
  <button data-t="p" onclick="setTab('p')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>Painel</button>
  <button data-t="n" onclick="setTab('n')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Números</button>
  <button data-t="c" onclick="setTab('c')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Contas</button>
  <button data-t="w" onclick="setTab('w')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Ganhando</button>
</nav>
<script>
/*CORE*/
const PKG_PRICE=2000, PKG_SIZE=21, ACC_MAX=70, MAXBID=100000, KEY='offy-numeros-v1';
function parseMoney(s){
  s=String(s==null?'':s).trim().replace(/R\$|\s/g,'');
  if(!/^\d+([.,]\d{1,2})?$/.test(s)) return null;
  const p=s.split(/[.,]/), d=p[1]||'';
  return parseInt(p[0],10)*100+parseInt((d+'00').slice(0,2),10);
}
function plain(c){return String(Math.floor(c/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+String(c%100).padStart(2,'0')}
function fmt(c){return 'R$ '+plain(c)}
function newState(){return {bid:0,bought:{},names:{},favs:{},acc:{},lbl:{},users:{},history:[]}}
function totalOf(st){return st.bid>=2?st.bid-1:0}
function stats(st){
  const total=totalOf(st); let done=0;
  for(const k in st.bought){const n=Number(k); if(Number.isInteger(n)&&n>=1&&n<=total&&st.bought[k]) done++}
  const pkgs=Math.ceil(total/PKG_SIZE);
  return {total,done,pending:total-done,pct:total?done/total*100:0,pkgs,invest:pkgs*PKG_PRICE,
    extra:pkgs*PKG_SIZE-total,pkgsLeft:Math.ceil((total-done)/PKG_SIZE),accs:Math.ceil(total/ACC_MAX)};
}
function favList(st){const t=totalOf(st);return Object.keys(st.favs||{}).map(Number).filter(n=>st.favs[n]&&n>=1&&n<=t).sort((a,b)=>a-b)}
const FC={y:'Amarelo',g:'Verde',b:'Azul'}, FHEX={y:'#f5b301',g:'#16a34a',b:'#3b82f6'}, FD={g:'Único e menor',b:'Único, mas há menores'};
function tag(n){const c=st.favs[n];return FD[c]?'<em class="tgl" style="color:'+FHEX[c]+'">'+FD[c]+'</em>':''}
let lastGap=null;
function setFav(st,n,c){
  const was=st.favs[n]; let promoted=null; lastGap=null;
  if(c) st.favs[n]=c; else delete st.favs[n];
  if(was==='g'&&c!=='g'){
    const nx=favList(st).filter(x=>st.favs[x]==='b'&&x>n)[0];
    if(nx!==undefined){
      let miss=0; for(let k=n+1;k<nx;k++) if(!st.bought[k]) miss++;
      if(miss===0){promoted=nx; st.favs[nx]='g'} else lastGap={n:nx,miss:miss};
    }
  }
  return promoted;
}
function promoMsg(pr){return pr?' · '+fmt(pr)+' virou verde':(lastGap?' · '+fmt(lastGap.n)+' segue azul (faltam '+lastGap.miss+' números antes dele)':'')}
function accOf(n){return Math.ceil(n/ACC_MAX)}
function accOv(n){return (st.acc&&st.acc[n])||accOf(n)}
function lblOf(n){return (st.lbl&&st.lbl[n])||accName(accOv(n))}
function accNumbers(st,a){
  const t=totalOf(st), out=[];
  for(let n=(a-1)*ACC_MAX+1;n<=Math.min(a*ACC_MAX,t);n++) out.push(n);
  return out;
}
function mark(st,n,by){
  const t=totalOf(st);
  if(!Number.isInteger(n)||n<1||n>t) return {ok:false,msg:'Número fora do intervalo (R$ 0,01 a '+fmt(t)+').'};
  if(st.bought[n]) return {ok:false,dup:true,msg:'Duplicado! '+fmt(n)+' já está registrado como comprado.'};
  st.bought[n]=by||true; return {ok:true,msg:fmt(n)+' registrado (Conta '+accOf(n)+').'};
}
function unmark(st,n){delete st.bought[n]}
function previewBid(st,c){
  const a=stats(st), b=stats(Object.assign({},st,{bid:c}));
  const all=Object.keys(st.bought).filter(k=>st.bought[k]).length;
  return {from:a,to:b,outside:all-b.done};
}
function applyBid(st,c){
  if(!Number.isInteger(c)||c<2||c>MAXBID) return {ok:false,msg:'Valor inválido.'};
  if(c===st.bid) return {ok:false,msg:'Esse já é o lance atual.'};
  if(st.bid){st.history=(st.history||[]).concat([{from:st.bid,to:c,t:Date.now()}]).slice(-20)}
  st.bid=c; return {ok:true};
}
function save(st,store){try{store.setItem(KEY,JSON.stringify(st));return true}catch(e){return false}}
function load(store){
  const st=newState();
  try{
    const o=JSON.parse(store.getItem(KEY)||'null'); if(!o) return st;
    if(Number.isInteger(o.bid)&&o.bid>=0&&o.bid<=MAXBID) st.bid=o.bid;
    for(const k in (o.bought||{})){const n=Number(k); if(Number.isInteger(n)&&n>=1&&o.bought[k]) st.bought[n]=(typeof o.bought[k]==='string'&&o.bought[k])||true}
    for(const k in (o.names||{})) if(typeof o.names[k]==='string') st.names[k]=o.names[k].slice(0,40);
    for(const k in (o.favs||{})){const n=Number(k); if(Number.isInteger(n)&&n>=1&&o.favs[k]) st.favs[n]=(o.favs[k]==='g'||o.favs[k]==='b')?o.favs[k]:'y'}
    for(const k in (o.users||{})) if(typeof o.users[k]==='string'&&/^#[0-9a-fA-F]{6}$/.test(o.users[k])) st.users[k]=o.users[k];
    for(const k in (o.lbl||{})){const n=Number(k); if(Number.isInteger(n)&&n>=1&&typeof o.lbl[k]==='string'&&o.lbl[k].trim()) st.lbl[n]=o.lbl[k].trim().slice(0,40)}
    for(const k in (o.acc||{})){const n=Number(k),a=Number(o.acc[k]); if(Number.isInteger(n)&&n>=1&&Number.isInteger(a)&&a>=1&&a<=9999) st.acc[n]=a}
    if(Array.isArray(o.history)) st.history=o.history.filter(h=>h&&Number.isInteger(h.from)&&Number.isInteger(h.to)).slice(-20).map(h=>({from:h.from,to:h.to,t:Number(h.t)||0}));
  }catch(e){}
  return st;
}
/*ENDCORE*/

let store; try{store=window.localStorage;store.getItem('x')}catch(e){store={getItem(){return null},setItem(){throw 1}}}
let st=load(store), tab='p', flt='all', q='', shown=120, opn=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const accName=a=>st.names[a]||('Conta '+a);
let warned=false;
function persist(){
  if(!save(st,store)&&!warned){warned=true;alert('Não foi possível salvar neste navegador.')}
  if(CLOUD_URL){ver++;dirty=true;clearTimeout(pt);pt=setTimeout(kick,300)}
}
function setTab(t){tab=t;draw()}
function draw(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  ({p:panel,n:nums,c:accs,w:win})[tab]();
}
function say(id,t,ok){const e=$(id); if(e){e.textContent=t;e.className='m '+(ok?'ok':'err')}}

function panel(){
  const s=stats(st);
  $('v').innerHTML=`
  <section class="card hero"><label>Lance principal</label>
    <div class="big">${st.bid?fmt(st.bid):'—'}</div>
    <div class="row"><input id="bid" inputmode="decimal" placeholder="Ex: 11,63" value="${st.bid?plain(st.bid):''}"><button class="btn" onclick="setBid()">${st.bid?'Trocar':'Definir'}</button></div>
    <small class="m" id="bm">${st.bid?'Números gerados: R$ 0,01 até '+fmt(st.bid-1)+'.':'Informe seu lance para gerar os números.'}</small></section>
  <div class="grid">
    <div class="st"><small>Total de números</small><b>${s.total}</b></div>
    <div class="st"><small>Comprados</small><b class="g">${s.done}</b></div>
    <div class="st"><small>Faltam</small><b>${s.pending}</b></div>
    <div class="st"><small>Contas necessárias</small><b>${s.accs}</b></div>
    <div class="st"><small>Pacotes (21 números)</small><b>${s.pkgs}</b></div>
    <div class="st"><small>Pacotes restantes</small><b>${s.pkgsLeft}</b></div>
    <div class="st w"><small>Investimento total</small><b class="g">${fmt(s.invest)}</b></div>
  </div>
  <section class="card prog"><div class="ring" style="--p:${s.pct}"><b>${Math.round(s.pct)}%</b></div><label>Conclusão · ${s.pct.toFixed(1).replace('.',',')}%</label><div class="bar"><i style="width:${s.pct}%"></i></div>
    <small class="m">${s.done} de ${s.total} números comprados${s.extra>0?' · sobram '+s.extra+' números extras nos pacotes':''}.</small></section>
  <section class="card"><label>Registrar compra</label>
    <div class="row"><input id="reg" inputmode="decimal" placeholder="Ex: 0,05" onkeydown="if(event.key==='Enter')reg()"><button class="btn" onclick="reg()">Registrar</button></div>
    <small class="m" id="rm"></small></section>
  ${pplCard()}${favCard()}${hist()}<section class="card dz"><label>Zona de perigo</label><button class="btn dn" style="width:100%;padding:12px" onclick="askReset()">Redefinir tudo</button><small class="m">Apaga o lance, todas as compras, os favoritos e os nomes das contas.</small></section>`;
}
function setBid(){
  const c=parseMoney($('bid').value);
  if(c===null||c<2||c>MAXBID){say('bm','Valor inválido. Use no mínimo R$ 0,02 e no máximo '+fmt(MAXBID)+'.',false);return}
  if(c===st.bid){say('bm','Esse já é o lance atual.',false);return}
  if(!st.bid){applyBid(st,c);persist();draw();say('bm','Lance salvo. Números de R$ 0,01 até '+fmt(c-1)+'.',true);return}
  const p=previewBid(st,c);
  modal('<h3>Trocar lance?</h3><p>'+fmt(st.bid)+' → <b style="color:var(--g)">'+fmt(c)+'</b><br>Números: '+p.from.total+' → '+p.to.total+'<br>Pacotes: '+p.from.pkgs+' → '+p.to.pkgs+' ('+fmt(p.to.invest)+')<br>Contas: '+p.from.accs+' → '+p.to.accs+'<br>Comprados válidos: '+p.to.done+' de '+p.to.total+(p.outside>0?'<br>'+p.outside+' compra(s) ficam acima do novo lance (guardadas, fora da contagem).':'')+'<br>Seu progresso continua.</p><div class="row"><button class="btn gh" onclick="modal(\'\')">Cancelar</button><button class="btn" onclick="doBid('+c+')">Trocar lance</button></div>');
}
function reg(){
  const c=parseMoney($('reg').value);
  if(c===null){say('rm','Digite um valor válido, ex: 0,05.',false);return}
  const r=mark(st,c,me&&me.name); if(r.ok) persist();
  const s=stats(st); const msg=r.msg;
  draw(); say('rm',msg,r.ok); const i=$('reg'); if(i) i.focus();
  if(r.ok) toast(msg,c);
}

function favCard(){
  const f=favList(st);
  return `<section class="card favc"><label>★ Números favoritos${f.length?' ('+f.length+')':''}</label>
    <div class="row"><input id="fav" inputmode="decimal" placeholder="Ex: 5,30" onkeydown="if(event.key==='Enter')addFav()"><button class="btn" onclick="addFav()">Favoritar</button></div>
    <div class="chips" id="fcs" style="align-items:center">${['y','g','b'].map(c=>`<button class="cb ${favColor===c?'on':''}" data-c="${c}" style="--c:${FHEX[c]};width:28px;height:28px" aria-label="${FC[c]}" onclick="setFavColor('${c}')"></button>`).join('')}<span style="font-size:13px;color:var(--mut);margin-left:4px">Cor ao favoritar</span></div>
    <div style="font-size:12px;color:var(--mut);line-height:1.7;margin-top:10px"><span style="color:#16a34a;font-weight:700">● Verde</span>: lance único e menor<br><span style="color:#3b82f6;font-weight:700">● Azul</span>: lance único, mas existem menores</div>
    <small class="m" id="fm">${st.bid?'Adicione vários. Toque no ★ de qualquer número na aba Números também.':'Defina o lance principal para favoritar números.'}</small>
    ${f.map(n=>`<div class="r ${st.bought[n]?'b':''} f${st.favs[n]}" onclick="tg(${n})"><span class="ix"${ixs(n)}>#${n}${by(n)}</span><b>${fmt(n)}${tag(n)}</b><span class="ac">${esc(lblOf(n))}</span><button class="fv on f${st.favs[n]}" title="Cor ou remover" onclick="event.stopPropagation();openFav(${n})">★</button><i>${st.bought[n]?'✓':''}</i></div>`).join('')}
    ${f.length?'<button class="lk" onclick="askClearFavs()">Limpar favoritos</button>':''}</section>`;
}
function addFav(){
  const c=parseMoney($('fav').value), t=totalOf(st);
  if(c===null||c<1||c>t){say('fm',t?'Digite um valor entre R$ 0,01 e '+fmt(t)+'.':'Defina o lance principal primeiro.',false);return}
  const had=st.favs[c];
  if(had===favColor){say('fm',fmt(c)+' já está nos favoritos ('+FC[had].toLowerCase()+').',false);return}
  const pr=setFav(st,c,favColor); persist(); draw(); say('fm',fmt(c)+(had?' mudou para ':' favoritado em ')+FC[favColor].toLowerCase()+'.'+promoMsg(pr),true); const i=$('fav'); if(i) i.focus();
}
let favColor='y';
function setFavColor(c){favColor=c;document.querySelectorAll('#fcs .cb').forEach(b=>b.classList.toggle('on',b.dataset.c===c))}
function openFav(n){
  const cur=st.favs[n];
  modal(`<h3>Favorito ${fmt(n)}</h3><p>Escolha a cor da estrela.</p><div class="row" style="justify-content:center;gap:20px;margin-bottom:18px">${['y','g','b'].map(c=>`<div class="cbw"><button class="cb ${cur===c?'on':''}" style="--c:${FHEX[c]}" aria-label="${FC[c]}" onclick="pickFav(${n},'${c}')"></button><small>${FC[c]}${FD[c]?'<br>'+FD[c]:''}</small></div>`).join('')}</div><div class="row"><button class="btn gh" onclick="modal('')">Cancelar</button>${cur?`<button class="btn dn" onclick="rmFav(${n})">Remover</button>`:''}</div>`);
}
function pickFav(n,c){const pr=setFav(st,n,c);persist();modal('');refresh();toast(fmt(n)+' favoritado ('+FC[c].toLowerCase()+')'+promoMsg(pr))}
function rmFav(n){const pr=setFav(st,n);persist();modal('');refresh();toast(fmt(n)+' removido dos favoritos'+promoMsg(pr))}
function askClearFavs(){
  modal('<h3>Limpar favoritos?</h3><p>Remove os '+favList(st).length+' números favoritos. As compras não são afetadas.</p><div class="row"><button class="btn gh" onclick="modal(\'\')">Cancelar</button><button class="btn dn" onclick="st.favs={};persist();modal(\'\');refresh()">Sim, limpar</button></div>');
}
function nums(){
  $('v').innerHTML=`<section class="card"><input id="q" placeholder="Buscar número (ex: 5,30 ou 11,6)" value="${esc(q)}" style="width:100%" oninput="q=this.value;shown=120;list()">
  <div class="chips">${[['all','Todos'],['pend','Pendentes'],['done','Comprados'],['fav','★ Favoritos']].map(f=>`<button class="chip ${flt===f[0]?'on':''}" onclick="flt='${f[0]}';shown=120;nums()">${f[1]}</button>`).join('')}</div></section><div class="sum" id="sm"></div><div id="lst"></div>`;
  list();
}
function list(){
  const s=stats(st), qq=q.trim().replace(/R\$|\s/g,''), exact=/[,.]\d{2}$/.test(qq)?parseMoney(qq):null;
  let out=[],count=0;
  for(let n=1;n<=s.total;n++){
    const b=!!st.bought[n];
    if(flt==='pend'&&b||flt==='done'&&!b||flt==='fav'&&!st.favs[n]) continue;
    if(qq){ if(exact!==null? n!==exact : !plain(n).includes(qq.replace('.',','))) continue }
    count++;
    if(out.length<shown) out.push(`<div class="r ${b?'b':''} ${st.favs[n]?'f'+st.favs[n]:''}" onclick="tg(${n})"><span class="ix"${ixs(n)}>#${n}${by(n)}</span><b>${fmt(n)}${tag(n)}</b><span class="ac">${esc(lblOf(n))}</span><button class="fv ${st.favs[n]?'on f'+st.favs[n]:''}" onclick="event.stopPropagation();openFav(${n})">${st.favs[n]?'★':'☆'}</button><i>${b?'✓':''}</i></div>`);
  }
  $('sm').textContent=s.total?`${count} número(s) · ${s.done} comprados · ${s.pending} pendentes`:'Defina o lance principal no Painel.';
  $('lst').innerHTML=out.join('')+(count>shown?`<button class="more" onclick="shown+=200;list()">Mostrar mais (${count-shown} restantes)</button>`:'');
}
let tt;
function toast(msg,n){
  const e=$('toast'); clearTimeout(tt);
  e.innerHTML='<span>'+msg+'</span>'+(n?'<button onclick="askUnmark('+n+')">Desmarcar</button>':'');
  e.className='show'; tt=setTimeout(()=>e.className='',5000);
}
function modal(h){if(!h&&document.activeElement&&document.activeElement.blur)document.activeElement.blur();$('modal').innerHTML=h?'<div class="ov" onclick="if(event.target===this)modal(\'\')"><div class="dlg">'+h+'</div></div>':''}
function askUnmark(n){
  modal('<h3>Desmarcar '+fmt(n)+'?</h3><p>Ele voltará para a lista de pendentes.</p><div class="row"><button class="btn gh" onclick="modal(\'\')">Cancelar</button><button class="btn dn" onclick="doUnmark('+n+')">Sim, desmarcar</button></div>');
}
function doUnmark(n){unmark(st,n);persist();modal('');refresh();toast(fmt(n)+' desmarcado')}
function refresh(){tab==='n'?list():tab==='c'?accs():draw()}
function askReset(){
  const s=stats(st);
  modal('<h3>Redefinir tudo?</h3><p>Isso apaga o lance principal, '+s.done+' compra(s) registrada(s), os favoritos e os nomes das contas. Não dá para desfazer. Se o app estiver sincronizado, apaga para todas as pessoas.</p><div class="row"><button class="btn gh" onclick="modal(\'\')">Cancelar</button><button class="btn dn" onclick="doReset()">Sim, apagar tudo</button></div>');
}
function hist(){
  const h=(st.history||[]).slice(-5).reverse(), s=stats(st), out=Object.keys(st.bought).filter(k=>st.bought[k]).length-s.done;
  if(!h.length&&out<=0) return '';
  return '<section class="card"><label>Histórico de lances</label>'+h.map(x=>'<div class="hl"><span>'+(x.t?new Date(x.t).toLocaleDateString('pt-BR'):'')+'</span><b>'+fmt(x.from)+' → '+fmt(x.to)+'</b></div>').join('')+(out>0?'<small class="m">'+out+' compra(s) acima do lance atual estão guardadas e voltam à contagem se você subir o lance.</small>':'')+'</section>';
}
function doBid(c){applyBid(st,c);persist();modal('');draw();toast('Lance trocado para '+fmt(c))}
function doReset(){
  st=newState(); if(me) st.users[me.name]=me.color; q=''; flt='all'; shown=120; opn=null; persist(); modal(''); tab='p'; draw(); toast('Tudo foi redefinido');
}
function tg(n){
  if(st.bought[n]){askUnmark(n);return}
  mark(st,n,me&&me.name); persist(); refresh(); toast(fmt(n)+' marcado como comprado',n);
}

function accs(){
  const s=stats(st); let h='';
  if(!s.total){$('v').innerHTML='<section class="card">Defina o lance principal no Painel para distribuir os números.</section>';return}
  h+=`<div class="sum">${s.accs} contas · máximo de ${ACC_MAX} números por conta · toque no nome para renomear</div>`;
  for(let a=1;a<=s.accs;a++){
    const ns=accNumbers(st,a), d=ns.filter(n=>st.bought[n]).length, o=opn===a;
    h+=`<section class="card"><div class="ah"><div class="ed"><input value="${esc(accName(a))}" maxlength="40" placeholder="Nome da conta" aria-label="Nome da conta" onchange="ren(${a},this)" onkeydown="if(event.key==='Enter')this.blur()"></div><button class="chip ${o?'on':''}" onclick="opn=${o?'null':a};accs()">${o?'Fechar':'Ver'}</button></div>
    <div class="bar"><i style="width:${d/ns.length*100}%"></i></div>
    <small class="m" style="margin:0">${d}/${ns.length} comprados · ${plain(ns[0])} a ${plain(ns[ns.length-1])}${(k=>k?' · ★ '+k:'')(ns.filter(n=>st.favs[n]).length)}</small>`;
    if(o) h+=`<div class="nc">${ns.map(n=>`<div class="${st.bought[n]?'b':''} ${st.favs[n]?'f f'+st.favs[n]:''} ${st.lbl[n]?'o':''}"${bs(n)} onclick="tg(${n})">${plain(n)}</div>`).join('')}</div><button class="more" style="margin-top:10px" onclick="cp(${a})">Copiar pendentes desta conta</button>`+ovBox(a,ns);
    h+='</section>';
  }
  $('v').innerHTML=h;
}
function win(){
  const t=totalOf(st);
  if(!t){$('v').innerHTML='<section class="card">Defina o lance principal no Painel.</section>';return}
  const g=[],b=[];
  favList(st).forEach(n=>{if(st.favs[n]==='g')g.push(n);else if(st.favs[n]==='b')b.push(n)});
  if(!g.length&&!b.length){$('v').innerHTML='<section class="card">Nenhum favorito verde ou azul ainda. Marque números como favoritos para acompanhá-los aqui.</section>';return}
  const base=0;
  const missing=n=>{let m=0;for(let k=base+1;k<n;k++) if(!st.bought[k]) m++;return m};
  const card=(n,c,label,extra)=>{
    const a=accOv(n), custom=st.names[a];
    return `<section class="card" style="border-left:4px solid ${FHEX[c]};padding:14px 16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div style="min-width:0"><small style="display:block;color:${FHEX[c]};font-size:12px;font-weight:700;letter-spacing:.04em">${label}</small><div style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em">${fmt(n)}</div><small style="color:var(--mut);font-size:12px">${FD[c]}</small></div><div style="text-align:right;min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lblOf(n))}</div>${custom?'<small style="color:var(--mut);font-size:12px">Conta '+a+'</small>':''}</div></div>${extra?'<small class="m" style="margin-top:8px">'+extra+'</small>':''}</section>`;
  };
  let h=`<div class="sum">${g.length} verde(s) · ${b.length} azul(is) · na ordem em que assumem se o verde cair</div>`;
  g.forEach(n=>{h+=card(n,'g','GANHANDO AGORA','')});
  if(!g.length) h+='<section class="card" style="color:var(--mut);font-size:14px">Nenhum número verde definido.</section>';
  b.forEach((n,i)=>{
    let ex;
    if(n<base) ex='Abaixo do verde atual.';
    else {const m=missing(n); ex=m===0?'<span style="color:#16a34a;font-weight:600">✓ Pronto: todos os números até ele já foram comprados.</span>':'Faltam '+m+' número(s) para comprar até ele ('+(n-1-m)+' de '+(n-1)+' já comprados).'}
    h+=card(n,'b',(i===0?'PRÓXIMO':(i+1)+'º NA FILA'),ex);
  });
  $('v').innerHTML=h;
}
function openAcc(n){
  const s=stats(st), cur=accOv(n); let o='';
  for(let a=1;a<=s.accs;a++) o+='<option value="'+a+'"'+(a===cur?' selected':'')+'>'+esc(accName(a))+(a===accOf(n)?' (padrão)':'')+'</option>';
  modal('<h3>Conta do '+fmt(n)+'</h3><p>Em qual conta este número foi comprado?</p><select id="accsel" style="width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--tx);margin-bottom:18px">'+o+'</select><div class="row"><button class="btn gh" onclick="modal(\'\')">Cancelar</button><button class="btn" onclick="saveAcc('+n+')">Salvar</button></div>'+(st.acc[n]?'<button class="lk" style="width:100%" onclick="saveAcc('+n+',1)">Voltar ao padrão ('+esc(accName(accOf(n)))+')</button>':''));
}
function saveAcc(n,reset){
  const a=reset?accOf(n):parseInt($('accsel').value,10);
  if(!a||a===accOf(n)) delete st.acc[n]; else st.acc[n]=a;
  persist(); modal(''); refresh(); toast(fmt(n)+' → '+accName(accOv(n)));
}
function openLbl(n){
  modal('<h3>Conta do '+fmt(n)+'</h3><p>Escreva o nome da conta onde este número foi comprado.</p><input id="lbl" autocomplete="off" maxlength="40" value="'+esc(lblOf(n))+'" onkeydown="if(event.key===\'Enter\')saveLbl('+n+')" style="width:100%;margin-bottom:18px"><div class="row"><button class="btn gh" onclick="modal(\'\')">Cancelar</button><button class="btn" onclick="saveLbl('+n+')">Salvar</button></div>'+(st.lbl[n]?'<button class="lk" style="width:100%" onclick="saveLbl('+n+',1)">Voltar ao padrão ('+esc(accName(accOv(n)))+')</button>':''));
}
function saveLbl(n,reset){
  const v=reset?'':$('lbl').value.trim().slice(0,40);
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  if(!v||v===accName(accOv(n))) delete st.lbl[n]; else st.lbl[n]=v;
  persist(); setTimeout(()=>{modal(''); refresh(); toast(fmt(n)+' → '+lblOf(n))},80);
}
function setLbl(n,el){
  const v=el.value.trim().slice(0,40);
  if(!v||v===accName(accOv(n))) delete st.lbl[n]; else st.lbl[n]=v;
  el.value=lblOf(n); el.classList.toggle('ov',!!(st.lbl[n]||st.acc[n])); persist();
}
function ovBox(a,ns){
  const ex=ns.filter(n=>st.lbl[n]);
  return '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><label>Mudar o nome de um número só</label><div class="row"><input id="ovn'+a+'" inputmode="decimal" placeholder="Número (ex: 0,05)"><input id="ovt'+a+'" maxlength="40" placeholder="Nome (ex: Conta X)"></div><button class="more" style="margin-top:10px" onclick="addOv('+a+')">Aplicar</button><small class="m" id="ovm'+a+'">Só esse número muda; os outros seguem o nome da conta.</small>'+ex.map(n=>'<div class="hl"><span>'+fmt(n)+'</span><b>'+esc(st.lbl[n])+'</b><button class="lk" style="padding:0" onclick="rmOv('+n+')">remover</button></div>').join('')+'</div>';
}
function addOv(a){
  const lo=(a-1)*ACC_MAX+1, hi=Math.min(a*ACC_MAX,totalOf(st));
  const n=parseMoney($('ovn'+a).value), v=$('ovt'+a).value.trim().slice(0,40);
  if(n===null||n<lo||n>hi){say('ovm'+a,'Digite um número desta conta (de '+plain(lo)+' a '+plain(hi)+').',false);return}
  if(!v){say('ovm'+a,'Digite o nome para este número.',false);return}
  if(v===accName(a)) delete st.lbl[n]; else st.lbl[n]=v;
  persist(); accs(); say('ovm'+a,fmt(n)+' agora aparece como "'+v+'".',true);
}
function rmOv(n){delete st.lbl[n]; persist(); accs()}
function ren(a,el){const v=el.value.trim(); if(v) st.names[a]=v.slice(0,40); else delete st.names[a]; el.value=accName(a); persist()}
function cp(a){
  const t=accNumbers(st,a).filter(n=>!st.bought[n]).map(plain).join('\n')||'Nenhum pendente';
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Lista copiada!')).catch(()=>prompt('Copie a lista:',t.replace(/\n/g,' ')));
}

/* ===== NUVEM / PESSOAS ===== */
// Para sincronizar entre pessoas, cole aqui a URL do seu Firebase Realtime Database.
// Ex: 'https://meu-projeto-default-rtdb.firebaseio.com'. Deixe vazio para usar só neste aparelho.
const CLOUD_URL='https://offy-registros-default-rtdb.firebaseio.com';
const ROOM='offy';
const PAL=['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#64748b','#a16207'];
const HEX=/^#[0-9a-fA-F]{6}$/;
let me=null, online=true, remote=null, dirty=false, syncing=false, ver=0, pt, lastRaw='', timer=null, loginColor=null;
const rurl=()=>CLOUD_URL.replace(/\/+$/,'')+'/'+ROOM+'.json';
function by(n){const v=st.bought[n];return typeof v==='string'?'<em class="tgl" style="color:'+(st.users[v]||'var(--mut)')+'">'+esc(v)+'</em>':''}
function ixs(n){const v=st.bought[n];return (typeof v==='string'&&st.users[v])?' style="border-left:5px solid '+st.users[v]+';padding-left:8px;border-radius:3px"':''}
function bs(n){const v=st.bought[n];return (typeof v==='string'&&st.users[v])?' style="box-shadow:inset 0 -4px 0 '+st.users[v]+'"':''}
function setStatus(ok){
  if(ok!==undefined) online=ok;
  const e=$('sy'); if(!e) return;
  e.innerHTML=me?'<i style="background:'+me.color+'"></i>'+esc(me.name)+(CLOUD_URL?' · '+(online?'online':'offline'):''):'';
}
function snap(){
  const o={bid:st.bid||null,hist:(st.history&&st.history.length)?st.history:null,b:{},f:{},nm:{},lb:{},u:{}};
  for(const k in st.bought) if(st.bought[k]) o.b['n'+k]=(typeof st.bought[k]==='string'?st.bought[k]:'?');
  for(const k in st.favs) if(st.favs[k]) o.f['n'+k]=st.favs[k];
  for(const k in st.names) o.nm['n'+k]=st.names[k];
  for(const k in st.lbl) o.lb['n'+k]=st.lbl[k];
  for(const k in st.users) o.u[k]=st.users[k];
  return o;
}
function flat(o){const f={};for(const c in o){const v=o[c];if(v&&typeof v==='object'&&!Array.isArray(v)){for(const k in v) f[c+'/'+k]=v[k]}else if(v!==null&&v!==undefined) f[c]=v}return f}
function coll(x){const o={};if(!x)return o;if(Array.isArray(x)){x.forEach((v,i)=>{if(v!=null)o[i]=v})}else Object.assign(o,x);return o}
function applyRemote(R){
  R=R||{};
  st.bid=Number.isInteger(R.bid)&&R.bid>=0&&R.bid<=MAXBID?R.bid:0;
  st.history=Array.isArray(R.hist)?R.hist.filter(h=>h&&Number.isInteger(h.from)&&Number.isInteger(h.to)).slice(-20).map(h=>({from:h.from,to:h.to,t:Number(h.t)||0})):[];
  st.bought={};st.favs={};st.names={};st.lbl={};st.users={};
  const num=k=>{const m=/^n(\d+)$/.exec(k);return m?Number(m[1]):null};
  let c=coll(R.b);for(const k in c){const n=num(k);if(n) st.bought[n]=(typeof c[k]==='string'&&c[k]!=='?')?c[k].slice(0,20):true}
  c=coll(R.f);for(const k in c){const n=num(k);if(n&&(c[k]==='y'||c[k]==='g'||c[k]==='b')) st.favs[n]=c[k]}
  c=coll(R.nm);for(const k in c){const n=num(k);if(n&&typeof c[k]==='string') st.names[n]=c[k].slice(0,40)}
  c=coll(R.lb);for(const k in c){const n=num(k);if(n&&typeof c[k]==='string') st.lbl[n]=c[k].slice(0,40)}
  c=coll(R.u);for(const k in c) if(typeof c[k]==='string'&&HEX.test(c[k])) st.users[k]=c[k];
  remote=flat(snap());
}
async function push(){
  const v=ver, cur=flat(snap()), prev=remote||{}, patch={}; let any=false;
  for(const k in cur) if(JSON.stringify(cur[k])!==JSON.stringify(prev[k])){patch[k]=cur[k];any=true}
  for(const k in prev) if(!(k in cur)){patch[k]=null;any=true}
  if(!any){if(v===ver) dirty=false;return}
  const r=await fetch(rurl(),{method:'PATCH',body:JSON.stringify(patch)});
  if(!r.ok) throw new Error('push');
  remote=cur; lastRaw=''; if(v===ver) dirty=false;
}
async function kick(){
  if(syncing) return; syncing=true;
  try{await push();setStatus(true)}catch(e){setStatus(false)}
  syncing=false;
}
function canRedraw(){
  const a=document.activeElement;
  return !(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&!$('modal').innerHTML;
}
async function pull(){
  if(!CLOUD_URL||syncing||!me) return; syncing=true;
  try{
    if(dirty) await push();
    const r=await fetch(rurl(),{cache:'no-store'}); if(!r.ok) throw new Error('pull');
    const raw=await r.text();
    if(!dirty&&raw!==lastRaw){
      lastRaw=raw; applyRemote(JSON.parse(raw)); save(st,store);
      if(me&&st.users[me.name]!==me.color){st.users[me.name]=me.color;persist()}
      if(canRedraw()) refresh();
    }
    setStatus(true);
  }catch(e){setStatus(false)}
  syncing=false;
}
async function cloudInit(){
  if(!CLOUD_URL) return;
  try{
    const r=await fetch(rurl(),{cache:'no-store'}); if(!r.ok) throw new Error('init');
    const raw=await r.text(), R=JSON.parse(raw);
    if(R&&(R.bid||R.u)){applyRemote(R);lastRaw=raw;save(st,store)}
    else{remote={};ver++;dirty=true}
    setStatus(true);
  }catch(e){setStatus(false)}
}
function takenBy(c,except){for(const u in st.users) if(st.users[u]===c&&u.toLowerCase()!==(except||'').toLowerCase()) return u;return null}
function loginView(){
  document.querySelector('nav').style.display='none'; setStatus();
  $('v').innerHTML=`<section class="card"><label>Seu nome</label><input id="nm" placeholder="Ex: Giovanni" maxlength="20" autocomplete="off" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
  <label style="margin-top:18px">Sua cor</label><div class="row" style="flex-wrap:wrap;gap:12px">${PAL.map(c=>`<button class="cb ${loginColor===c?'on':''}" data-c="${c}" style="--c:${c};${takenBy(c)?'opacity:.25':''}" aria-label="Cor" onclick="pickColor('${c}')"></button>`).join('')}</div>
  <button class="btn" style="width:100%;padding:13px;margin-top:20px" onclick="doLogin()">Entrar</button>
  <small class="m" id="lm">Cores apagadas já estão em uso por outra pessoa.</small></section>`;
}
function pickColor(c){
  const nm=($('nm').value||'').trim(), t=takenBy(c,nm);
  if(t){say('lm','Essa cor já é de '+t+'.',false);return}
  loginColor=c; document.querySelectorAll('.cb[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===c)); say('lm','',true);
}
function doLogin(){
  let name=($('nm').value||'').replace(/[.$#\[\]\/]/g,' ').replace(/\s+/g,' ').trim().slice(0,20);
  if(!name){say('lm','Digite seu nome.',false);return}
  for(const u in st.users) if(u.toLowerCase()===name.toLowerCase()) name=u;
  if(!loginColor){say('lm','Escolha uma cor.',false);return}
  const t=takenBy(loginColor,name); if(t){say('lm','Essa cor já é de '+t+'.',false);return}
  me={name,color:loginColor};
  try{store.setItem('offy-me',JSON.stringify(me))}catch(e){}
  if(st.users[name]!==me.color){st.users[name]=me.color;persist()}
  startApp();
}
function switchUser(){
  try{store.setItem('offy-me','null')}catch(e){}
  me=null; loginColor=null; loginView();
}
function pplCard(){
  const cnt={}; let anon=0;
  for(const k in st.bought){const v=st.bought[k]; if(typeof v==='string') cnt[v]=(cnt[v]||0)+1; else if(v) anon++}
  const names=Object.keys(st.users).sort((a,b)=>a.localeCompare(b));
  if(!names.length) return '';
  return `<section class="card"><label>Pessoas e cores</label>${names.map(u=>`<div class="hl" style="align-items:center"><span style="display:flex;align-items:center;gap:10px;color:var(--tx)"><i style="width:14px;height:14px;border-radius:50%;background:${st.users[u]};display:inline-block"></i>${esc(u)}${me&&me.name===u?' (você)':''}</span><b>${cnt[u]||0} comprados</b></div>`).join('')}${anon?'<small class="m">'+anon+' compra(s) sem dono (feitas antes do login).</small>':''}<button class="lk" onclick="switchUser()">Trocar de pessoa</button></section>`;
}
function startApp(){
  document.querySelector('nav').style.display='flex';
  setStatus(); draw();
  if(CLOUD_URL&&!timer){timer=setInterval(pull,5000);kick()}
}
async function boot(){
  try{me=JSON.parse(store.getItem('offy-me')||'null')}catch(e){me=null}
  if(me&&!(me.name&&HEX.test(me.color||''))) me=null;
  if(CLOUD_URL){$('v').innerHTML='<section class="card">Conectando…</section>'; await cloudInit()}
  if(me){ if(st.users[me.name]!==me.color){st.users[me.name]=me.color;persist()} startApp() } else loginView();
}
boot();
</script>
